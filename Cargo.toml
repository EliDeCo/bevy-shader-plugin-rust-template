[package]
name = "bevy-shader-plugin-rust-template"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = "0.19.1"
bevy-shader-plugin = { version = "0.2.1", features = ["spirv"] }

# Compiles the shader crate in `shader/` (see build.rs).
[build-dependencies]
spirv-builder = "0.10.0"

# Compile build-dependencies in release mode with the same settings as regular
# dependencies. Otherwise the rust-gpu compiler is built in debug mode and is very slow.
[profile.release.build-override]
opt-level = 3
codegen-units = 16
[profile.dev.build-override]
opt-level = 3
