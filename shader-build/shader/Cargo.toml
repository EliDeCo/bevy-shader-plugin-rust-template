[package]
name = "solar_system_shader"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Pinned to the revision matching ../rust-toolchain.toml.
spirv-std = { git = "https://github.com/Rust-GPU/rust-gpu.git", rev = "63d5a41422010cd3f732b587b9dcd1d1a2b42de7", version = "0.10.0-alpha.1" }

# Stands alone rather than joining shader-build's workspace. It lives *under*
# shader-build so that rustup, walking up from here, finds
# ../rust-toolchain.toml — spirv-builder strips RUSTUP_TOOLCHAIN from the inner
# cargo invocation, so directory position is what selects the nightly.
[workspace]
