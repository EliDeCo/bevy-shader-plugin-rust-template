[package]
name = "shader-build"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
# Pulls in rustc_codegen_spirv, which needs `feature(rustc_private)` — this is
# why the crate is pinned to the nightly in rust-toolchain.toml, and why it is
# excluded from the app's workspace.
spirv-builder = { git = "https://github.com/Rust-GPU/rust-gpu.git", rev = "63d5a41422010cd3f732b587b9dcd1d1a2b42de7", version = "0.10.0-alpha.1" }

# Build the codegen backend optimised even in dev; it is painfully slow otherwise.
[profile.release.build-override]
opt-level = 3
codegen-units = 16
[profile.dev.build-override]
opt-level = 3

[workspace]
